<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booscik Tools</title>
    <style>
        /* Reset i baza */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0a0512; /* Głęboki, bardzo ciemny fiolet/czerń */
            color: #fff;
            overflow-hidden: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- POTĘŻNE ANIMOWANE TŁO --- */
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.2) 0%, rgba(0,0,0,0) 70%);
            filter: blur(80px);
            z-index: 1;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        /* Latające cząsteczki w tle (Matrix/Sci-Fi style) */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* --- KONTENER GŁÓWNY (HEADER) --- */
        .container {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 2rem;
        }

        /* Nowoczesny, neony nagłówek z efektem RGB/Glow */
        h1 {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #a855f7, #c084fc, #6366f1);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGradient 4s linear infinite, float 6s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
            margin-bottom: 10px;
        }

        /* Podnapisy / Mały akcent line */
        .subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 0.5s forwards;
        }

        /* Dekoracyjna linia pod tekstem */
        .line {
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #a855f7, transparent);
            margin: 20px auto 0;
            animation: expandLine 2s ease-out 1s forwards;
        }

        /* --- ANIMACJE CSS --- */
        @keyframes textGradient {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes expandLine {
            to { width: 150px; }
        }

        /* Responsywność pod telefony */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .bg-glow { width: 300px; height: 300px; }
        }
    </style>
</head>
<body>

    <!-- Efekty w tle -->
    <div class="bg-glow"></div>
    <canvas class="particles" id="particleCanvas"></canvas>

    <!-- Główna zawartość -->
    <div class="container">
        <h1>Booscik Tools</h1>
        <p class="subtitle">Next-Gen Utility Hub</p>
        <div class="line"></div>
    </div>

    <!-- Skrypt na żywe tło (delikatne, latające kropki) -->
    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const numParticles = 60;
        const particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * -0.5 - 0.1; // Ruch lekko w górę
                this.color = `rgba(168, 85, 247, ${Math.random() * 0.4 + 0.1})`; // Odcienie fioletu z przezroczystością
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Reset pozycji jak wylecą za ekran
                if (this.y < 0) this.y = height;
                if (this.x < 0 || this.x > width) this.x = Math.random() * width;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#a855f7';
                ctx.fill();
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.shadowBlur = 0; // Reset shadow do czyszczenia
            for (const particle of particles) {
                particle.update();
                particle.draw();
            }
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
