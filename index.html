<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booscik Tools</title>
    <style>
        /* Reset i baza */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0914; /* Głęboki fiolet z Twojego programu */
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- POTĘŻNE ANIMOWANE TŁO --- */
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(106, 27, 154, 0.2) 0%, rgba(0,0,0,0) 70%);
            filter: blur(90px);
            z-index: 1;
            animation: pulseGlow 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* --- INTERFEJS APLIKACJI (Z REPLICZNYM KOLOREM I RAMKĄ RGB) --- */
        .main-window {
            position: relative;
            z-index: 3;
            background: #0f0914;
            width: 720px;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            padding: 6px; /* Przestrzeń pod imitację ramki z Canvasa */
            transition: all 0.3s ease;
        }

        /* Dynamiczna animacja krawędzi RGB imitująca funkcję animuj_rgb() */
        .main-window::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 8px;
            padding: 3px; 
            background: linear-gradient(45deg, #6a1b9a, #b39ddb, #4caf50, #6a1b9a);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            background-size: 400% 400%;
            animation: borderRGB 6s linear infinite;
            pointer-events: none;
        }

        /* Wewnętrzny kontener (main_frame) */
        .main-frame {
            background: #0f0914;
            border-radius: 6px;
            padding: 20px;
        }

        /* Górny pasek (Header) */
        .header-frame {
            background: #2d1f3d;
            margin: -20px -20px 20px -20px;
            padding: 12px 20px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .btn-close {
            color: #888888;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-close:hover { color: #ff3333; }

        /* Wyszukiwarka (input_frame) */
        .input-frame {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .lbl-appid {
            color: #b39ddb;
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .entry-appid {
            flex-grow: 1;
            background: #2d1f3d;
            border: 1px solid #6a1b9a;
            color: #ffffff;
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
        }

        .btn-load {
            background: #6a1b9a;
            color: #ffffff;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-load:hover { background: #4a148c; }

        /* Karta Informacji (info_card) */
        .info-card {
            background: #1a1025;
            border: 1px solid #2d1f3d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .info-card-title {
            color: #b39ddb;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: -30px;
            background: #0f0914;
            display: inline-block;
            padding: 0 8px;
            margin-bottom: 15px;
        }

        .img-label {
            width: 100%;
            height: 270px;
            background: #0f0914;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8e82a0;
            font-weight: bold;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .img-label img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lbl-game-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .lbl-game-type {
            font-size: 1rem;
            color: #b39ddb;
            margin-bottom: 15px;
        }

        /* Przycisk Pobierania (btn_download) */
        .btn-download {
            width: 100%;
            background: #4caf50;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: not-allowed;
            opacity: 0.4;
            transition: all 0.2s;
        }
        .btn-download.active {
            cursor: pointer;
            opacity: 1;
        }
        .btn-download.active:hover { background: #388e3c; }

        /* Status działania (lbl_status) */
        .lbl-status {
            color: #8e82a0;
            font-size: 0.9rem;
            font-style: italic;
            text-align: center;
            min-height: 20px;
        }

        /* --- LIVE SUGGESTIONS WINDOW --- */
        .suggestion-window {
            position: absolute;
            background: #1a1025;
            border: 1px solid #6a1b9a;
            border-radius: 4px;
            width: 100%;
            top: 100%;
            left: 0;
            z-index: 10;
            display: none;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.2s;
            gap: 15px;
        }

        .suggestion-item:hover {
            background: #6a1b9a;
        }

        .suggestion-item img {
            width: 85px;
            height: 40px;
            object-fit: cover;
            border-radius: 2px;
            background: #0f0914;
        }

        .suggestion-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffffff;
        }

        /* Sekcja powitalna ("Strona główna" przed kliknięciem generatora) */
        .welcome-screen {
            text-align: center;
            z-index: 3;
            max-width: 500px;
        }
        .welcome-screen h1 {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #b39ddb, #ffffff, #6a1b9a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .btn-launcher {
            background: #6a1b9a;
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(106, 27, 154, 0.4);
            transition: all 0.3s;
        }
        .btn-launcher:hover {
            background: #4a148c;
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(106, 27, 154, 0.7);
        }

        /* Ukrywanie elementów interfejsu */
        .hidden { display: none !important; }

        @keyframes borderRGB {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }
    </style>
    <!-- Biblioteka JSZip do tworzenia archiwum ZIP w przeglądarce -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div class="bg-glow"></div>
    <canvas class="particles" id="particleCanvas"></canvas>

    <!-- 1. EKRAN STARTOWY (Z PRZYCISKIEM GENERATORA) -->
    <div class="welcome-screen" id="welcomeScreen">
        <h1>Booscik Tools</h1>
        <button class="btn-launcher" onclick="openGenerator()">LAUNCH GENERATOR</button>
    </div>

    <!-- 2. OKNO PROGRAMU (UKRYTE NA START) -->
    <div class="main-window hidden" id="mainWindow">
        <div class="main-frame">
            <!-- Header -->
            <div class="header-frame">
                <div class="header-title">BOOSCIK LUA TOOL</div>
                <div class="btn-close" onclick="closeGenerator()">✖</div>
            </div>

            <!-- Input / Szukaj -->
            <div class="input-frame">
                <div class="lbl-appid">SZUKAJ GRY:</div>
                <input type="text" class="entry-appid" id="entryAppid" placeholder="Wpisz nazwę gry lub ID..." oninput="onKeyRelease(this)">
                <button class="btn-load" onclick="startInfoProcess()">SZUKAJ</button>
                
                <!-- Podpowiedzi Live -->
                <div class="suggestion-window" id="suggestionWindow"></div>
            </div>

            <!-- Karta danych ze Steam -->
            <div class="info-card">
                <div class="info-card-title">Dane z platformy Steam</div>
                <div class="img-label" id="imgLabel">[ Brak miniaturki ]</div>
                <div class="lbl-game-name" id="lblGameName">Nazwa: ---</div>
                <div class="lbl-game-type" id="lblGameType">Typ: ---</div>
                <button class="btn-download" id="btnDownload" onclick="downloadLuaFiles()">📥 POBIERZ PLIKI LUA</button>
            </div>

            <!-- Status Systemowy -->
            <div class="lbl-status" id="lblStatus"></div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://api.luagen.revobd.club/";
        let currentAppId = null;
        let searchTimer = null;

        // Przełączanie ekranów
        function openGenerator() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('mainWindow').classList.remove('hidden');
        }

        function closeGenerator() {
            document.getElementById('mainWindow').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            resetForm();
        }

        function setStatus(text, color = "#b39ddb") {
            const status = document.getElementById('lblStatus');
            status.innerText = text;
            status.style.color = color;
        }

        function resetForm() {
            document.getElementById('entryAppid').value = '';
            document.getElementById('imgLabel').innerHTML = '[ Brak miniaturki ]';
            document.getElementById('lblGameName').innerText = 'Nazwa: ---';
            document.getElementById('lblGameType').innerText = 'Typ: ---';
            const btn = document.getElementById('btnDownload');
            btn.classList.remove('active');
            setStatus('');
            currentAppId = null;
        }

        // Obsługa Live Suggestions (Wyszukiwanie w locie)
        function onKeyRelease(input) {
            clearTimeout(searchTimer);
            const query = input.value.trim();
            const suggWindow = document.getElementById('suggestionWindow');

            if (query.length < 2 || !isNaN(query)) {
                suggWindow.style.display = 'none';
                return;
            }

            searchTimer = setTimeout(() => {
                fetch(`https://cors-anywhere.herokuapp.com/https://store.steampowered.com/api/storesearch/?term=${encodeURIComponent(query)}&l=polish&cc=PL`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.items && data.items.length > 0) {
                            updateSuggestions(data.items.slice(0, 5));
                        } else {
                            suggWindow.style.display = 'none';
                        }
                    })
                    .catch(() => {
                        // Jeśli CORS proxy jest zablokowane, pobieramy standardowo przez główny przycisk Szukaj
                    });
            }, 300);
        }

        function updateSuggestions(items) {
            const suggWindow = document.getElementById('suggestionWindow');
            suggWindow.innerHTML = '';
            suggWindow.style.display = 'block';

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.onclick = () => {
                    document.getElementById('entryAppid').value = item.id;
                    suggWindow.style.display = 'none';
                    startInfoProcess();
                };

                const imgUrl = `https://cdn.cloudflare.steamstatic.com/steam/apps/${item.id}/capsule_sm_120.jpg`;
                div.innerHTML = `
                    <img src="${imgUrl}" onerror="this.style.display='none'">
                    <div class="suggestion-text">${item.name} (ID: ${item.id})</div>
                `;
                suggWindow.appendChild(div);
            });
        }

        // Ukrywanie podpowiedzi przy kliknięciu obok
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.input-frame')) {
                document.getElementById('suggestionWindow').style.display = 'none';
            }
        });

        // Szukanie gry i pobieranie danych ze Steam
        function startInfoProcess() {
            const query = document.getElementById('entryAppid').value.trim();
            if (!query) {
                alert("Wprowadź nazwę gry lub poprawne cyfrowe ID!");
                return;
            }

            document.getElementById('btnDownload').classList.remove('active');

            if (!isNaN(query)) {
                currentAppId = query;
                setStatus(`Odpytywanie API Steam dla ID ${query}...`);
                fetchSteamData(query);
            } else {
                setStatus(`Szukanie AppID dla nazwy: '${query}'...`);
                searchGameByName(query);
            }
        }

        function searchGameByName(name) {
            // Uwaga: Bezpośrednie zapytania do Steam z poziomu przeglądarki mogą wymagać CORS. 
            // Jeśli Steam blokuje zapytanie, używamy bezpiecznego fallbacku na bezpośrednie ID lub proxy.
            fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://store.steampowered.com/api/storesearch/?term=${encodeURIComponent(name)}&l=polish&cc=PL`)}`)
                .then(res => res.json())
                .then(wrapper => {
                    const data = JSON.parse(wrapper.contents);
                    if (data && data.items && data.items.length > 0) {
                        const bestMatch = data.items[0];
                        currentAppId = bestMatch.id;
                        setStatus(`Znaleziono ID: ${currentAppId}. Ładowanie danych...`);
                        fetchSteamData(currentAppId);
                    } else {
                        setStatus("Nie znaleziono żadnej gry o podanej nazwie.", "#ff3333");
                    }
                })
                .catch(err => setStatus(`Błąd wyszukiwania: ${err.message}`, "#ff3333"));
        }

        function fetchSteamData(appid) {
            fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://store.steampowered.com/api/appdetails?appids=${appid}`)}`)
                .then(res => res.json())
                .then(wrapper => {
                    const data = JSON.parse(wrapper.contents);
                    if (data && data[appid] && data[appid].success) {
                        const appInfo = data[appid].data;
                        document.getElementById('lblGameName').innerText = `Nazwa: ${appInfo.name}`;
                        document.getElementById('lblGameType').innerText = `Typ: ${appInfo.type.toUpperCase()}`;
                        
                        if (appInfo.header_image) {
                            document.getElementById('imgLabel').innerHTML = `<img src="${appInfo.header_image}">`;
                        } else {
                            document.getElementById('imgLabel').innerText = '[ Brak zdjęcia ]';
                        }

                        setStatus("Pobrano dane ze Steam. Sprawdzanie serwera pod kątem paczki...");
                        checkZipExistence(appid);
                    } else {
                        setStatus("Steam API: Brak danych o tym ID.", "#ff3333");
                    }
                })
                .catch(err => setStatus(`Błąd API Steam: ${err.message}`, "#ff3333"));
        }

        // Sprawdzanie dostępności pliku .zip na Twoim serwerze
        function checkZipExistence(appid) {
            const url = `${BASE_URL}${appid}.zip`;
            
            // Ponieważ HEAD może zgłaszać błędy CORS na serwerze zewnętrznym, robimy bezpieczny fetch z modelem no-cors lub allorigins
            fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`)
                .then(res => res.json())
                .then(wrapper => {
                    // Sprawdzamy czy wrapper nie zwrócił błędu 404 w zawartości
                    if(wrapper.status && wrapper.status.http_code === 404) {
                        setStatus("Brak dostępnych skryptów LUA dla tej gry na serwerze.", "#ff3333");
                        document.getElementById('btnDownload').classList.remove('active');
                    } else {
                        setStatus("Paczka jest dostępna na serwerze! Możesz pobrać pliki.", "#4caf50");
                        document.getElementById('btnDownload').classList.add('active');
                    }
                })
                .catch(() => {
                    setStatus("Brak dostępnych skryptów LUA dla tej gry na serwerze lub problem z połączeniem.", "#ff3333");
                });
        }

        // Pobieranie i automatyczne wypakowywanie / pobieranie skryptów LUA
        function downloadLuaFiles() {
            if (!document.getElementById('btnDownload').classList.contains('active')) return;

            setStatus("Pobieranie archiwum ZIP ze skryptami...");
            const url = `${BASE_URL}${currentAppId}.zip`;

            // Pobieramy plik binarny ZIP przez proxy
            fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`)
                .then(res => res.json())
                .then(wrapper => {
                    // Konwertujemy zawartość tekstową bazy allorigins z powrotem na obiekt binarny (jeśli proxy podaje string)
                    // Dla czystego pobierania najlepiej użyć bezpośredniego linku, przeglądarka sama pobierze plik ZIP
                    setStatus("Pobieranie rozpoczęte...", "#4caf50");
                    
                    // W przeglądarce najwygodniej dla użytkownika jest po prostu ściągnąć spakowaną paczkę ZIP bezpośrednio na dysk:
                    const win = window.open(url, '_blank');
                    setStatus(`Paczka ZIP dla ID ${currentAppId} została pobrana do Twojego folderu Pobrane!`, "#4caf50");
                })
                .catch(err => {
                    // Fallback: jeśli proxy zawiedzie, uderzamy bezpośrednio linkiem do pobrania
                    window.location.href = url;
                    setStatus(`Rozpoczęto bezpośrednie pobieranie pliku ${currentAppId}.zip`, "#4caf50");
                });
        }

        /* --- ANIMOWANE CZĄSTECZKI W TLE --- */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const numParticles = 40;
        const particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * -0.3 - 0.1;
                this.color = Math.random() < 0.7 ? `rgba(179, 157, 219, ${Math.random() * 0.3 + 0.1})` : `rgba(76, 175, 80, ${Math.random() * 0.2 + 0.05})`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < 0) this.y = height;
                if (this.x < 0 || this.x > width) this.x = Math.random() * width;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        for (let i = 0; i < numParticles; i++) particles.push(new Particle());
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
