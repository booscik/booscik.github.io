<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOSCIK FNSHOP — dzisiejszy sklep</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #05060f;
  --bg-card: rgba(12, 16, 36, 0.72);
  --accent: #7b5cff;
  --accent-2: #00d4ff;
  --accent-3: #ff4ecd;
  --text: #e8e6f0;
  --text-dim: #9a96b0;
  --gold: #ffd966;
  --radius: 16px;
  --vbuck-rate: 0.0462375;
  --discount: 0.55;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

#galaxy-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

.nebula {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  opacity: 0.55;
  background:
    radial-gradient(ellipse 80% 60% at 15% 20%, rgba(100, 40, 200, 0.28), transparent 55%),
    radial-gradient(ellipse 70% 50% at 85% 70%, rgba(0, 120, 255, 0.22), transparent 50%),
    radial-gradient(ellipse 60% 70% at 50% 90%, rgba(255, 40, 180, 0.16), transparent 55%);
  animation: nebulaDrift 28s ease-in-out infinite alternate;
}

@keyframes nebulaDrift {
  0%   { transform: scale(1) translate(0, 0); opacity: 0.55; }
  50%  { transform: scale(1.08) translate(-1%, 1.5%); opacity: 0.7; }
  100% { transform: scale(1.04) translate(1.5%, -1%); opacity: 0.6; }
}

header {
  position: relative; z-index: 10; text-align: center;
  padding: 4rem 1.5rem 1.5rem;
}

.logo {
  font-size: clamp(2rem, 5.5vw, 3.6rem);
  font-weight: 800; letter-spacing: 0.08em;
  background: linear-gradient(135deg, var(--accent-2), var(--accent), var(--accent-3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 30px rgba(123, 92, 255, 0.45));
  animation: logoPulse 4s ease-in-out infinite;
  margin-bottom: 0.5rem;
}

@keyframes logoPulse {
  0%, 100% { filter: drop-shadow(0 0 30px rgba(123, 92, 255, 0.45)); }
  50%      { filter: drop-shadow(0 0 55px rgba(0, 212, 255, 0.65)); }
}

.subtitle {
  font-size: clamp(0.8rem, 1.8vw, 1rem);
  color: var(--text-dim);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 1rem;
}

#shop-date {
  font-size: 0.9rem;
  color: var(--accent-2);
  margin-bottom: 1.5rem;
  letter-spacing: 0.08em;
}

main {
  position: relative; z-index: 10;
  max-width: 1400px; margin: 0 auto;
  padding: 0 1.5rem 4rem;
}

#top-bar {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 1rem;
  padding: 0.9rem 1.25rem;
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid rgba(123, 92, 255, 0.2);
  backdrop-filter: blur(14px);
  margin-bottom: 1.5rem;
  font-size: 0.85rem;
}

#countdown-wrap { display: flex; align-items: center; gap: 0.6rem; }

#countdown {
  font-size: 1.3rem; font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.4));
  min-width: 6ch;
}

#countdown-label {
  color: var(--text-dim); font-size: 0.75rem;
  text-transform: uppercase; letter-spacing: 0.1em;
}

.status-left { display: flex; align-items: center; gap: 0.6rem; flex: 1; min-width: 200px; }

.dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: #00e676; box-shadow: 0 0 10px #00e676;
  animation: dotPulse 2s ease-in-out infinite;
  flex-shrink: 0;
}

.dot.error { background: #ff5252; box-shadow: 0 0 10px #ff5252; }
.dot.loading { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.dot.changed { background: var(--accent-3); box-shadow: 0 0 14px var(--accent-3); }

@keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

#refresh-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border: none; color: #fff; font-weight: 600;
  padding: 0.5rem 1.2rem; border-radius: 999px;
  cursor: pointer; font-size: 0.82rem; letter-spacing: 0.04em;
  transition: transform 0.2s, box-shadow 0.2s;
}

#refresh-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(123, 92, 255, 0.45); }
#refresh-btn:disabled { opacity: 0.5; cursor: wait; }

#rate-info {
  display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem;
  justify-content: center; margin-bottom: 2rem;
  font-size: 0.8rem; color: var(--text-dim);
}

#rate-info strong { color: var(--accent-2); }

#shop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1.25rem;
}

.card {
  position: relative; border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid rgba(123, 92, 255, 0.18);
  backdrop-filter: blur(12px);
  transition: transform 0.35s cubic-bezier(.22,.68,0,1.2), box-shadow 0.35s, border-color 0.35s;
  animation: cardIn 0.6s ease both;
}

.card:hover {
  transform: translateY(-8px) scale(1.015);
  box-shadow: 0 20px 60px rgba(123, 92, 255, 0.25), 0 0 0 1px rgba(0, 212, 255, 0.25);
  border-color: rgba(0, 212, 255, 0.4);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(28px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.card-img-wrap {
  position: relative; aspect-ratio: 1 / 1;
  overflow: hidden;
  background: linear-gradient(135deg, #0d1230, #1a1040);
}

.card-img-wrap img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.5s ease;
}

.card:hover .card-img-wrap img { transform: scale(1.08); }

.card-rarity {
  position: absolute; top: 10px; left: 10px;
  padding: 0.25rem 0.7rem; border-radius: 999px;
  font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  backdrop-filter: blur(8px);
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.15);
}

.card-discount-tag {
  position: absolute; top: 10px; right: 10px;
  padding: 0.3rem 0.65rem; border-radius: 10px;
  font-size: 0.72rem; font-weight: 800;
  background: linear-gradient(135deg, #ff4ecd, #ff6b6b);
  color: #fff;
  box-shadow: 0 4px 16px rgba(255, 78, 205, 0.4);
}

.card-body { padding: 1rem 1.1rem 1.25rem; }

.card-name {
  font-size: 0.95rem; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 0.45rem;
}

.card-type {
  font-size: 0.72rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: 0.75rem;
}

.price-row {
  display: flex;
  align-items: baseline;
  gap: 0.55rem;
  flex-wrap: wrap;
}

.price-old {
  position: relative;
  display: inline-block;
  font-size: 0.9rem;
  font-weight: 600;
  color: #c7c3d8;
  padding: 0 2px;
  opacity: 0.95;
}

.price-old::after {
  content: '';
  position: absolute;
  left: -2px;
  right: -2px;
  top: 52%;
  height: 1px;
  background: linear-gradient(90deg,
    rgba(255, 107, 107, 0.85) 0%,
    rgba(255, 78, 205, 0.85) 50%,
    rgba(255, 107, 107, 0.85) 100%);
  pointer-events: none;
  border-radius: 1px;
}

.price-pln {
  font-size: 1.35rem; font-weight: 800;
  background: linear-gradient(135deg, var(--gold), #ffb347);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px rgba(255, 217, 102, 0.35));
}

.price-label { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.06em; }

.skeleton {
  border-radius: var(--radius);
  background: linear-gradient(90deg, rgba(30,35,70,0.6) 25%, rgba(50,55,100,0.6) 50%, rgba(30,35,70,0.6) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
  aspect-ratio: 1 / 1.35;
}

@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

#error-box {
  display: none; padding: 1.5rem 1.75rem;
  border-radius: var(--radius);
  background: rgba(255, 82, 82, 0.08);
  border: 1px solid rgba(255, 82, 82, 0.3);
  margin-bottom: 2rem;
}

#error-box.visible { display: block; }

#error-box h3 { color: #ff8a8a; margin-bottom: 0.75rem; font-size: 1rem; }

#error-detail {
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 0.82rem;
  color: #ffb3b3;
  background: rgba(0,0,0,0.35);
  padding: 0.85rem 1rem;
  border-radius: 10px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 400px;
  overflow-y: auto;
  margin-bottom: 1rem;
}

footer {
  position: relative; z-index: 10; text-align: center;
  padding: 2rem 1.5rem 3rem;
  font-size: 0.78rem; color: var(--text-dim);
  border-top: 1px solid rgba(123, 92, 255, 0.12);
  margin-top: 3rem;
}

footer a { color: var(--accent-2); text-decoration: none; }
footer a:hover { text-decoration: underline; }

@media (max-width: 640px) {
  header { padding: 2.5rem 1rem 1rem; }
  #shop-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.9rem; }
  .card-body { padding: 0.8rem 0.85rem 1rem; }
  .price-pln { font-size: 1.1rem; }
  .price-old { font-size: 0.82rem; }
  #countdown { font-size: 1.1rem; }
}
</style>
</head>
<body>

<canvas id="galaxy-canvas"></canvas>
<div class="nebula"></div>

<header>
  <div class="logo">BOOSCIK FNSHOP</div>
  <p class="subtitle">Dzisiejszy sklep · 55% wartości · ceny w PLN</p>
  <p id="shop-date">—</p>
</header>

<main>
  <div id="top-bar">
    <div id="countdown-wrap">
      <span id="countdown-label">Następna rotacja:</span>
      <span id="countdown">--:--:--</span>
    </div>
    <div class="status-left">
      <span class="dot loading" id="status-dot"></span>
      <span id="status-text">Łączenie z API…</span>
    </div>
    <button id="refresh-btn" onclick="loadShop()">Odśwież</button>
  </div>

  <div id="rate-info"></div>

  <div id="error-box">
    <h3 id="error-title">Błąd API</h3>
    <div id="error-detail"></div>
    <button onclick="loadShop()">Spróbuj ponownie</button>
  </div>

  <div id="shop-grid"></div>
</main>

<footer>
  Kurs: 1 V-Buck ≈ <strong id="footer-rate"></strong> PLN · Ceny = 55% wartości przedmiotu · zaokrąglane do 0 lub 5 zł<br>
  Źródło: <a href="https://fortnite-api.com/v2/shop" target="_blank" rel="noopener">fortnite-api.com/v2/shop</a>
</footer>

<script>
// ═══════════════════════════════════════════════
//  GALAXY CANVAS
// ═══════════════════════════════════════════════
(function () {
  const canvas = document.getElementById('galaxy-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [], dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildStars();
  }

  function buildStars() {
    const count = Math.floor((innerWidth * innerHeight) / 6500);
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.6 + 0.3,
        baseA: Math.random() * 0.55 + 0.2,
        speed: Math.random() * 0.015 + 0.003,
        phase: Math.random() * Math.PI * 2,
        hue: Math.random() < 0.15 ? (Math.random() < 0.5 ? 200 : 280) : 0,
        drift: (Math.random() - 0.5) * 0.06
      });
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of stars) {
      const twinkle = Math.sin(t * s.speed + s.phase) * 0.5 + 0.5;
      const alpha = s.baseA * (0.4 + twinkle * 0.6);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      if (s.hue) {
        ctx.fillStyle = `hsl(${s.hue}, 85%, 78%)`;
        ctx.globalAlpha = alpha;
      } else {
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.globalAlpha = 1;
      }
      ctx.fill();
      ctx.globalAlpha = 1;
      s.x += s.drift;
      if (s.x > innerWidth + 5) s.x = -5;
      if (s.x < -5) s.x = innerWidth + 5;
    }
    if (Math.random() < 0.004) {
      const sx = Math.random() * innerWidth;
      const sy = Math.random() * innerHeight * 0.6;
      const len = 80 + Math.random() * 120;
      const grad = ctx.createLinearGradient(sx, sy, sx + len, sy - len * 0.5);
      grad.addColorStop(0, 'rgba(255,255,255,0.85)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + len, sy - len * 0.5);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    requestAnimationFrame(draw);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();

// ═══════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════
const API_KEY = 'b47b9df9-def4-4d66-b9a7-05f548f6f0b2';
const API_URL = 'https://fortnite-api.com/v2/shop?language=pl';
const VBUCK_TO_PLN = 0.0462375;
const DISCOUNT = 0.55;
const POLL_INTERVAL = 90_000;

let lastHash = null;

// ═══════════════════════════════════════════════
//  COUNTDOWN
// ═══════════════════════════════════════════════
function updateCountdown() {
  const now = new Date();
  const next = new Date(Date.UTC(
    now.getUTCFullYear(), now.getUTCMonth(),
    now.getUTCDate() + (now.getUTCHours() >= 0 ? 1 : 0),
    0, 0, 0
  ));
  const diff = Math.max(0, Math.floor((next - now) / 1000));
  const hh = String(Math.floor(diff / 3600)).padStart(2, '0');
  const mm = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
  const ss = String(diff % 60).padStart(2, '0');
  document.getElementById('countdown').textContent = `${hh}:${mm}:${ss}`;
}

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function roundPLN(amount) {
  return Math.round(amount / 5) * 5;
}

const priceOriginal = v => roundPLN(v * VBUCK_TO_PLN);
const priceFinal = v => roundPLN(v * VBUCK_TO_PLN * DISCOUNT);

const fmtPLN = a => a + ' zł';

const RARITY_COLOR = {
  common:'#b0b0b0', uncommon:'#00c853', rare:'#2979ff', epic:'#aa00ff',
  legendary:'#ff9100', mythic:'#ffd600', exotic:'#ff6d00', frozen:'#80d8ff',
  lava:'#ff3d00', shadow:'#616161', slurp:'#00e5ff', dark:'#5e35b1',
  starwars:'#ffee58', marvel:'#e53935', dc:'#1e88e5', icon:'#00bcd4',
  gaminglegends:'#ff4081'
};
const rarityColor = r => RARITY_COLOR[(r || '').toLowerCase()] || '#7b5cff';

// ═══════════════════════════════════════════════
//  DOM
// ═══════════════════════════════════════════════
const $grid = document.getElementById('shop-grid');
const $dot = document.getElementById('status-dot');
const $statusText = document.getElementById('status-text');
const $errorBox = document.getElementById('error-box');
const $errorTitle = document.getElementById('error-title');
const $errorDetail = document.getElementById('error-detail');
const $rateInfo = document.getElementById('rate-info');
const $refreshBtn = document.getElementById('refresh-btn');
const $shopDate = document.getElementById('shop-date');
document.getElementById('footer-rate').textContent = VBUCK_TO_PLN.toFixed(6).replace('.', ',');

function setStatus(state, text) {
  $dot.className = 'dot ' + state;
  $statusText.textContent = text;
}

function showSkeletons(n) {
  $grid.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'skeleton';
    $grid.appendChild(s);
  }
}

function showError(title, detail) {
  $errorTitle.textContent = title;
  $errorDetail.textContent = detail;
  $errorBox.classList.add('visible');
}

function hideError() { $errorBox.classList.remove('visible'); }

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
function renderItems(items, isUpdate) {
  $grid.innerHTML = '';
  hideError();

  const totalOrig = items.reduce((s, it) => s + priceOriginal(it.vbucks), 0);
  const totalFinal = items.reduce((s, it) => s + priceFinal(it.vbucks), 0);

  $rateInfo.innerHTML = `
    <span>Kurs: <strong>1 V-Buck = ${VBUCK_TO_PLN.toFixed(6).replace('.', ',')} PLN</strong></span>
    <span>Rabat: <strong>55% wartości</strong></span>
    <span>Przedmiotów: <strong>${items.length}</strong></span>
    <span>Suma oryginalna: <strong>${fmtPLN(totalOrig)}</strong></span>
    <span>Suma po rabacie: <strong>${fmtPLN(totalFinal)}</strong></span>
  `;

  items.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (idx * 0.04) + 's';
    const rc = rarityColor(item.rarity);
    const img = item.image || 'https://fortnite-api.com/images/cosmetics/br/cid_028_athena_commando_f.png';
    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="${img}" alt="${item.name}" loading="lazy"
             onerror="this.src='https://fortnite-api.com/images/cosmetics/br/cid_028_athena_commando_f.png'">
        <span class="card-rarity" style="color:${rc};border-color:${rc}44;">${item.rarity || '—'}</span>
        <span class="card-discount-tag">-45%</span>
      </div>
      <div class="card-body">
        <div class="card-name" title="${item.name}">${item.name}</div>
        <div class="card-type">${item.type || 'Cosmetic'}</div>
        <div class="price-row">
          <span class="price-old" title="Cena oryginalna">${fmtPLN(priceOriginal(item.vbucks))}</span>
          <span class="price-pln">${fmtPLN(priceFinal(item.vbucks))}</span>
        </div>
      </div>`;
    $grid.appendChild(card);
  });

  setStatus(isUpdate ? 'changed' : '', `OK · ${items.length} przedmiotów${isUpdate ? ' (rotacja!)' : ''} · ${new Date().toLocaleTimeString('pl-PL')}`);
}

// ═══════════════════════════════════════════════
//  PARSING
// ═══════════════════════════════════════════════
function extractItems(data) {
  const items = [];
  const seen = new Set();
  const entries = data?.entries || [];

  for (const entry of entries) {
    const entryItems = entry.items || entry.brItems || [];
    for (const ci of entryItems) {
      const cosmetic = ci.item || ci;
      const id = cosmetic.id || ci.id;
      if (!id || seen.has(id)) continue;
      seen.add(id);
      const vb = entry.finalPrice ?? entry.regularPrice ?? cosmetic.price ?? ci.price ?? 0;
      if (vb <= 0) continue;
      const images = cosmetic.images || ci.images || {};
      items.push({
        name: cosmetic.name || ci.name || 'Nieznany przedmiot',
        type: cosmetic.type?.displayValue || cosmetic.type?.value || ci.type?.displayValue || ci.type?.value || 'Cosmetic',
        rarity: cosmetic.rarity?.displayValue || cosmetic.rarity?.value || ci.rarity?.displayValue || ci.rarity?.value || 'Common',
        vbucks: vb,
        image: images.icon || images.featured || images.smallIcon || images.large || ''
      });
    }
  }

  if (!items.length && data) {
    const sections = ['featured', 'daily', 'specialFeatured', 'specialDaily', 'votes'];
    for (const section of sections) {
      const entries2 = data?.[section]?.entries || data?.[section] || [];
      for (const entry of entries2) {
        const entryItems = entry.items || entry.brItems || [];
        for (const ci of entryItems) {
          const cosmetic = ci.item || ci;
          const id = cosmetic.id || ci.id;
          if (!id || seen.has(id)) continue;
          seen.add(id);
          const vb = entry.finalPrice ?? entry.regularPrice ?? cosmetic.price ?? ci.price ?? 0;
          if (vb <= 0) continue;
          const images = cosmetic.images || ci.images || {};
          items.push({
            name: cosmetic.name || ci.name || 'Nieznany przedmiot',
            type: cosmetic.type?.displayValue || cosmetic.type?.value || 'Cosmetic',
            rarity: cosmetic.rarity?.displayValue || cosmetic.rarity?.value || 'Common',
            vbucks: vb,
            image: images.icon || images.featured || images.smallIcon || ''
          });
        }
      }
    }
  }

  return items;
}

// ═══════════════════════════════════════════════
//  LOAD SHOP
// ═══════════════════════════════════════════════
async function loadShop(silent = false) {
  if (!silent) {
    $refreshBtn.disabled = true;
    setStatus('loading', 'Pobieranie dzisiejszego sklepu…');
    hideError();
    showSkeletons(12);
  }

  let res, text;
  try {
    res = await fetch(API_URL, {
      method: 'GET',
      headers: {
        'Authorization': API_KEY,
        'Accept': 'application/json'
      },
      cache: 'no-store'
    });
  } catch (e) {
    if (!silent) {
      setStatus('error', 'Fetch failed');
      showError('Nie można połączyć się z API',
        'Błąd: ' + e.message + '\n\n' +
        'Możliwe przyczyny:\n' +
        '• Otwierasz plik przez file:// — użyj lokalnego serwera (np. `python -m http.server 8000` i wejdź na http://localhost:8000/sklep.html)\n' +
        '• Adblock/extension blokuje request\n' +
        '• Brak internetu'
      );
      $grid.innerHTML = '';
    }
    $refreshBtn.disabled = false;
    return;
  }

  text = await res.text();

  if (!res.ok) {
    if (!silent) {
      setStatus('error', `HTTP ${res.status}`);
      showError(`API zwróciło HTTP ${res.status}`,
        'URL: ' + API_URL + '\n' +
        'Status: ' + res.status + ' ' + res.statusText + '\n' +
        'Odpowiedź:\n' + text.slice(0, 2000)
      );
      $grid.innerHTML = '';
    }
    $refreshBtn.disabled = false;
    return;
  }

  let json;
  try { json = JSON.parse(text); }
  catch (e) {
    if (!silent) {
      setStatus('error', 'Zły JSON');
      showError('API zwróciło niepoprawny JSON', text.slice(0, 2000));
      $grid.innerHTML = '';
    }
    $refreshBtn.disabled = false;
    return;
  }

  const data = json?.data;
  const shopHash = data?.hash || null;
  const shopDate = data?.date || null;

  if (silent && lastHash && shopHash === lastHash) {
    $refreshBtn.disabled = false;
    return;
  }

  const isUpdate = !!(lastHash && shopHash && shopHash !== lastHash);
  if (shopHash) lastHash = shopHash;

  const items = extractItems(data);

  if (!items.length) {
    if (!silent) {
      setStatus('error', 'Brak itemów');
      showError('Nie udało się wyciągnąć itemów z odpowiedzi API',
        'Struktura data:\n' + JSON.stringify(data, null, 2).slice(0, 3000));
      $grid.innerHTML = '';
    }
    $refreshBtn.disabled = false;
    return;
  }

  items.sort((a, b) => b.vbucks - a.vbucks);

  if (shopDate) {
    const d = new Date(shopDate);
    $shopDate.textContent = 'Sklep z ' + d.toLocaleString('pl-PL', {
      dateStyle: 'full', timeStyle: 'short'
    });
  } else {
    $shopDate.textContent = 'Dzisiejszy sklep';
  }

  renderItems(items, isUpdate);
  $refreshBtn.disabled = false;
}

// ═══════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════
loadShop(false);
updateCountdown();
setInterval(updateCountdown, 1000);
setInterval(() => loadShop(true), POLL_INTERVAL);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadShop(true);
});
</script>
